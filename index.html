<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>白熊保齡球 🎳</title>
    <!-- 引入圓潤活潑日系字體 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #F4F6F9;           /* 乾淨柔和底色 */
            --card-bg: #FFFFFF;            /* 純白卡片 */
            --poke-red: #FF5350;           /* 精靈球紅 */
            --poke-red-hover: #E04340;
            --poke-yellow: #FFCB05;        /* 皮卡丘電光黃 */
            --poke-blue: #2A75BB;          /* 寶可夢藍 */
            --line-green: #06C755;         /* LINE 綠色 */
            --text-main: #2C2C2C;          /* 深灰文字 */
            --text-sub: #6E7C8C;
            --border-line: #E8ECEF;
            --radius-lg: 20px;
            --radius-sm: 12px;
            --shadow-poke: 0 8px 24px rgba(42, 117, 187, 0.08);
            --transition: all 0.2s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { 
            font-family: 'M PLUS Rounded 1c', -apple-system, sans-serif;
            max-width: 480px; margin: 0 auto; padding: 16px 12px 30px 12px; 
            background-color: var(--bg-color); color: var(--text-main); line-height: 1.5;
        }

        /* 標題區塊 */
        .header-container { text-align: center; margin: 8px 0 16px 0; }
        .header-title-box {
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            background: #FFFFFF; padding: 8px 20px; border-radius: 30px;
            border: 2px solid var(--poke-red); box-shadow: 0 4px 14px rgba(255, 83, 80, 0.15);
        }
        .header-img { width: 34px; height: 34px; object-fit: contain; }
        .header-title { 
            font-size: 1.2rem; font-weight: 900; color: #2C2C2C; 
            margin: 0; letter-spacing: 0.5px;
        }
        .subtitle { 
            font-size: 0.82rem; color: var(--poke-red); margin-top: 8px; font-weight: 800;
            display: flex; align-items: center; justify-content: center; gap: 4px;
        }

        /* 卡片容器 */
        .box { 
            background-color: var(--card-bg); border-radius: var(--radius-lg); 
            padding: 16px; margin-bottom: 14px; box-shadow: var(--shadow-poke);
            border: 1px solid var(--border-line); position: relative; overflow: hidden;
        }
        
        .box::after {
            content: ''; position: absolute; right: -15px; bottom: -15px;
            width: 70px; height: 70px;
            background: radial-gradient(circle, transparent 20%, rgba(255, 83, 80, 0.04) 21%);
            border: 6px solid rgba(0, 0, 0, 0.02); border-radius: 50%; pointer-events: none;
        }

        label { font-size: 0.88rem; color: #333; font-weight: 800; display: block; margin-bottom: 6px; }

        .input-group { margin-bottom: 14px; position: relative; }

        /* 手機高度與輸入框優化 */
        input[type="date"], input[type="text"], textarea { 
            width: 100%; padding: 12px; border: 2px solid #E2E8F0; border-radius: var(--radius-sm); 
            font-size: 15px; font-family: inherit; background-color: #F8FAFC; color: var(--text-main); 
            font-weight: 700; transition: var(--transition); -webkit-appearance: none;
            min-height: 46px;
        }
        
        input[type="date"]:focus, input[type="text"]:focus, textarea:focus { 
            outline: none; border-color: var(--poke-blue); background-color: #FFFFFF; 
            box-shadow: 0 0 0 3px rgba(42, 117, 187, 0.15);
        }

        .input-with-btn { display: flex; gap: 8px; align-items: center; }
        .input-with-btn input { flex: 1; }
        
        .btn-paste {
            padding: 0 14px; border: 2px solid #D0E1FD; background-color: #EBF3FF; color: var(--poke-blue);
            border-radius: var(--radius-sm); font-weight: 800; font-size: 0.88rem; cursor: pointer;
            transition: var(--transition); white-space: nowrap; display: flex; align-items: center;
            min-height: 46px; flex-shrink: 0;
        }
        .btn-paste:active { transform: scale(0.95); background-color: #D6E6FF; }

        /* 餐廳下拉選單 */
        .dropdown-menu {
            position: absolute; top: calc(100% + 4px); left: 0; right: 0;
            background: #FFFFFF; border: 2px solid #E2E8F0; border-radius: var(--radius-sm);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.12); z-index: 100; max-height: 200px; overflow-y: auto;
            display: none;
        }
        .dropdown-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px; border-bottom: 1px solid #F1F5F9; font-size: 0.88rem; font-weight: 700;
            cursor: pointer; transition: var(--transition);
        }
        .dropdown-item:last-child { border-bottom: none; }
        .dropdown-item:active { background-color: #F1F5F9; }
        .dropdown-item .rest-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .dropdown-item .btn-del-rest {
            background: none; border: none; color: #FF5350; cursor: pointer; padding: 4px 8px;
            font-size: 0.9rem; border-radius: 6px; transition: var(--transition);
        }

        textarea { min-height: 85px; resize: vertical; }

        /* 訓練家名牌標籤 */
        .tag-container { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 14px 0; }
        .name-tag { 
            padding: 8px 14px; border: 2px solid #E2E8F0; background-color: #F8FAFC; color: #475569; 
            border-radius: 20px; cursor: pointer; font-size: 0.85rem; font-weight: 800;
            transition: var(--transition); user-select: none; display: inline-flex; align-items: center; 
            justify-content: center; min-height: 38px;
        }
        .name-tag:active { transform: scale(0.92); }
        .name-tag.active { 
            background-color: var(--poke-yellow); color: #1E293B; border-color: #334155; 
            box-shadow: 2px 2px 0px #334155; transform: translateY(-1px);
        }

        /* 主動作按鈕 */
        .btn-action { margin-top: 12px; display: flex; gap: 8px; }
        button.action-btn { 
            flex: 1; padding: 12px; border: none; border-radius: var(--radius-sm); cursor: pointer; 
            font-size: 0.95rem; font-weight: 900; min-height: 48px; font-family: inherit;
            display: inline-flex; align-items: center; justify-content: center; transition: var(--transition);
        }
        
        .btn-primary { 
            background-color: var(--poke-red); color: white; 
            box-shadow: 0 4px 12px rgba(255, 83, 80, 0.3); border: 2px solid #D83A37;
        }
        .btn-primary:active { transform: scale(0.96); background-color: var(--poke-red-hover); }
        
        .btn-secondary { background-color: #F1F5F9; color: #475569; border: 2px solid #CBD5E1; }
        .btn-secondary:active { transform: scale(0.96); background-color: #E2E8F0; }
        
        /* 輔助通用按鈕 */
        .btn-danger, .btn-copy, .btn-line, .btn-edit, .btn-filter {
            white-space: nowrap; flex-shrink: 0; font-size: 0.8rem; font-weight: 800; 
            border-radius: 8px; padding: 6px 10px; cursor: pointer; display: inline-flex;
            align-items: center; justify-content: center; gap: 4px; line-height: 1.2;
            min-height: 36px; box-sizing: border-box; transition: var(--transition);
        }

        .btn-danger { background-color: #FFEAE8; color: #D83A37; border: 1.5px solid #FFC4C2; }
        .btn-danger:disabled { background-color: #E2E8F0; color: #94A3B8; border-color: #CBD5E1; cursor: not-allowed; opacity: 0.8; }

        .btn-copy { background-color: #EBF3FF; color: var(--poke-blue); border: 1.5px solid #B3D0FF; }
        .btn-line { background-color: #E6F9ED; color: var(--line-green); border: 1.5px solid #A3E9BC; }
        .btn-edit { background-color: #FFF7D6; color: #8A6D00; border: 1.5px solid #FFE885; }
        .btn-filter { background-color: var(--poke-blue); color: #FFFFFF; border: 1.5px solid #1D588F; }
        .btn-filter:active { transform: scale(0.95); }

        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; gap: 8px; flex-wrap: wrap; }
        .section-header h3 { margin: 0; font-size: 0.98rem; color: #1E293B; font-weight: 900; display: flex; align-items: center; gap: 4px; white-space: nowrap; }
        
        .action-group { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
        
        /* 時間區間選擇器 */
        .filter-container {
            background: #F8FAFC; border-radius: var(--radius-sm); padding: 12px;
            margin-bottom: 14px; border: 1.5px solid #E2E8F0; box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
            display: none;
        }
        .filter-title {
            font-size: 0.85rem; font-weight: 800; color: #475569; margin-bottom: 8px; display: flex; align-items: center; gap: 4px;
        }
        .filter-date-grid { 
            display: grid; grid-template-columns: 1fr auto 1fr; gap: 6px; align-items: center; margin-bottom: 10px; 
        }
        .filter-date-grid input[type="date"] { 
            padding: 8px 6px; font-size: 0.82rem; text-align: center; min-height: 42px; border-radius: 8px;
        }
        .filter-separator { font-weight: 800; color: #94A3B8; text-align: center; font-size: 0.85rem; }

        .filter-btn-grid { display: flex; gap: 6px; width: 100%; flex-wrap: wrap; }
        .filter-btn-grid button { flex: 1; min-height: 40px; font-size: 0.82rem; padding: 6px 4px; }

        /* 彈跳動畫 */
        .pop-in { animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes popIn {
            from { opacity: 0; transform: scale(0.96); }
            to { opacity: 1; transform: scale(1); }
        }

        /* 組隊結果卡片 */
        .result-item { 
            padding: 10px 12px; background-color: #F8FAFC; border-radius: var(--radius-sm); 
            margin-bottom: 8px; font-size: 0.88rem; font-weight: 700; border: 1.5px solid #E2E8F0;
            word-break: break-all; line-height: 1.6;
        }
        .restaurant-item-box {
            display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap;
        }
        .team-badge { background: #EBF3FF; color: var(--poke-blue); padding: 2px 8px; border-radius: 6px; font-weight: 900; border: 1px solid #B3D0FF; margin: 0 2px; display: inline-block; }
        .bye-badge { background: #FFF7D6; color: #8A6D00; padding: 2px 8px; border-radius: 6px; font-weight: 900; border: 1px solid #FFE885; display: inline-block; }
        
        /* 歷史紀錄卡片 */
        .history-card {
            background: #FFFFFF; border-radius: var(--radius-sm); padding: 12px; margin-bottom: 12px;
            border: 1.5px solid #E2E8F0; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03); transition: var(--transition);
        }
        .history-header { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
        .history-date-title { font-size: 0.95rem; color: #1E293B; font-weight: 900; display: flex; align-items: center; gap: 4px; }
        .history-teams { 
            font-size: 0.85rem; line-height: 1.6; padding-top: 8px;
            border-top: 1px dashed #E2E8F0; display: grid; grid-template-columns: 1fr; gap: 6px; font-weight: 700;
        }
        .history-teams .full-width { grid-column: span 1; }
        
        .toggle-history-btn {
            width: 100%; text-align: center; padding: 12px; background: #FFFFFF; border: 2px dashed #CBD5E1;
            border-radius: var(--radius-sm); color: var(--text-sub); font-size: 0.85rem; cursor: pointer;
            margin-top: 8px; font-weight: 800; transition: var(--transition); min-height: 44px;
        }
        .toggle-history-btn:active { background-color: #F8FAFC; color: var(--text-main); }

        .empty-text { color: var(--text-sub); font-size: 0.85rem; text-align: center; padding: 16px 0; font-weight: 700; }
        
        .restaurant-link { color: var(--poke-blue); font-weight: 800; text-decoration: none; word-break: break-all; }
        .restaurant-link:active { text-decoration: underline; }

        /* Modal 編輯彈出視窗 */
        .modal-backdrop {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.55); z-index: 1000;
            display: flex; justify-content: center; align-items: flex-end; padding: 0;
        }
        @media (min-width: 480px) {
            .modal-backdrop { align-items: center; padding: 16px; }
        }

        .modal-content {
            background: #FFFFFF; border-top-left-radius: var(--radius-lg); border-top-right-radius: var(--radius-lg);
            width: 100%; max-width: 480px; max-height: 88vh; overflow-y: auto; padding: 16px;
            box-shadow: 0 -8px 24px rgba(0,0,0,0.15);
            animation: popIn 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @media (min-width: 480px) {
            .modal-content { border-radius: var(--radius-lg); }
        }

        .modal-header {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 2px solid var(--border-line); padding-bottom: 10px; margin-bottom: 14px;
        }
        .modal-header h3 { margin: 0; font-size: 1.05rem; font-weight: 900; }
        .modal-close {
            background: none; border: none; font-size: 1.3rem; cursor: pointer; color: var(--text-sub);
            padding: 4px 8px; line-height: 1;
        }

        .drop-zone {
            background: #F8FAFC; border: 2px dashed #CBD5E1; border-radius: var(--radius-sm);
            padding: 10px; min-height: 52px; display: flex; flex-wrap: wrap; gap: 8px;
            align-items: center; margin-top: 6px; transition: var(--transition);
        }
        .drop-zone.drag-over {
            background: #EBF3FF; border-color: var(--poke-blue);
        }

        .draggable-player {
            background: var(--poke-yellow); color: #1E293B; border: 1.5px solid #334155;
            padding: 6px 12px; border-radius: 20px; font-weight: 800; font-size: 0.85rem;
            cursor: grab; display: inline-flex; align-items: center; gap: 6px;
            user-select: none; transition: transform 0.1s; line-height: 1.2;
        }
        .draggable-player:active { cursor: grabbing; transform: scale(0.95); }
        .draggable-player .btn-del-p {
            background: rgba(0,0,0,0.12); border: none; border-radius: 50%; width: 20px; height: 20px;
            display: inline-flex; justify-content: center; align-items: center; font-size: 0.85rem;
            cursor: pointer; color: #333; margin-left: 2px; font-weight: bold;
        }
        .draggable-player .btn-del-p:active { background: var(--poke-red); color: white; }
    </style>
</head>
<body>

    <div class="header-container">
        <div class="header-title-box">
            <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/25.png" alt="Pikachu" class="header-img">
            <h2 class="header-title">白熊保齡球 🎳</h2>
        </div>
        <div class="subtitle">
            <span>就決定是你了！不能黑箱的決鬥抽籤 ⚡</span>
        </div>
    </div>

    <!-- 輸入區塊 -->
    <div class="box">
        <div class="input-group">
            <label for="eventDate">📅 活動日期</label>
            <input type="date" id="eventDate">
        </div>

        <div class="input-group">
            <label for="restaurantInput">🍽️ 用餐餐廳</label>
            <div class="input-with-btn">
                <input type="text" id="restaurantInput" placeholder="餐廳名稱或貼上 Google Map 連結..." oninput="filterRestaurantDropdown()">
                <button class="btn-paste" onclick="pasteClipboard()">📋 貼上</button>
            </div>
            <!-- 下拉選單區塊 -->
            <div id="restaurantDropdown" class="dropdown-menu"></div>
        </div>

        <label>👥 選擇登場訓練家</label>
        <div class="tag-container" id="tagContainer"></div>

        <label for="nameInput">📝 參賽訓練家名單（每行一位）</label>
        <textarea id="nameInput" placeholder="點擊上方按鈕選取，或直接輸入..."></textarea>
        
        <div class="btn-action">
            <button id="btnGenerate" class="action-btn btn-primary" onclick="generateTeams()">⚡ 開始擲球配對</button>
            <button class="action-btn btn-secondary" onclick="clearAll()">重置</button>
        </div>
    </div>

    <!-- 本次結果區塊 -->
    <div class="box">
        <div class="section-header">
            <h3>🔴 本次對戰組合</h3>
            <div class="action-group">
                <button id="lineCurrentBtn" class="btn-line" style="display: none;" onclick="shareLineCurrentResult()">💬 LINE</button>
                <button id="copyCurrentBtn" class="btn-copy" style="display: none;" onclick="copyCurrentResult()">📋 複製</button>
            </div>
        </div>
        <div id="currentResult"><div class="empty-text">⚡ 點擊上方按鈕開始隨機隊伍配對</div></div>
    </div>

    <!-- 歷史紀錄區塊 -->
    <div class="box">
        <div class="section-header">
            <h3>📖 訓練家對戰圖鑑</h3>
            <button id="btnClearCloud" class="btn-danger" onclick="clearCloudHistory()">🗑️ 清空紀錄</button>
        </div>

        <!-- 時間區間選擇器 -->
        <div id="filterContainer" class="filter-container">
            <div class="filter-title">🔍 選擇歷史時間區間</div>
            <div class="filter-date-grid">
                <input type="date" id="startDate">
                <span class="filter-separator">至</span>
                <input type="date" id="endDate">
            </div>
            <div class="filter-btn-grid">
                <button class="btn-filter" onclick="applyDateFilter()">🔍 搜尋區間</button>
                <button class="btn-copy" onclick="copyRangeHistory()">📋 複製區間</button>
                <button class="btn-line" onclick="shareRangeHistoryToLine()">💬 分享區間</button>
                <button class="btn-secondary" style="font-size:0.8rem; border-radius:8px;" onclick="resetDateFilter()">重置</button>
            </div>
        </div>

        <div id="historyList"><div class="empty-text">連線至 Firebase 中...</div></div>
        <button id="toggleHistoryBtn" class="toggle-history-btn" style="display: none;" onclick="toggleHistoryExpand()">👇 展開更多對戰圖鑑紀錄</button>
    </div>

    <!-- ✏️ 對戰圖鑑彈出編輯視窗 (Modal) -->
    <div id="editModal" class="modal-backdrop" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3>✏️ 編輯對戰紀錄</h3>
                <button class="modal-close" onclick="closeEditModal()">✖</button>
            </div>
            
            <div class="input-group">
                <label for="editModalDate">📅 活動日期</label>
                <input type="date" id="editModalDate">
            </div>

            <div class="input-group">
                <label>👥 對戰組合（拖曳人員以變更分組）</label>
                <div id="editModalTeamsContainer"></div>
                <button class="btn-secondary" style="width:100%; margin-top:10px; border-radius:10px; min-height:42px; font-weight:800;" onclick="addModalTeamGroup()">➕ 新增一組</button>
            </div>

            <div class="input-group">
                <label>☕ 輪空人員 (Bye)</label>
                <div id="editModalByeZone" class="drop-zone" data-team-index="bye"></div>
            </div>

            <div class="input-group">
                <label>➕ 新增人員至對戰</label>
                <div class="input-with-btn">
                    <input type="text" id="editModalNewPlayerName" placeholder="輸入人員姓名...">
                    <button class="btn-paste" style="background:var(--poke-yellow); color:#1E293B; border-color:#D4A000;" onclick="addPlayerToModal()">加入</button>
                </div>
            </div>

            <div class="btn-action" style="margin-top:20px; gap:10px;">
                <button class="action-btn btn-primary" onclick="saveEditModal()">💾 儲存修改</button>
                <button class="action-btn btn-secondary" onclick="closeEditModal()">取消</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getDatabase, ref, set, onValue, remove } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCKmizSfVR7fJU4DnCkK51hxkxnCNsHg54",
            authDomain: "bowling-team.firebaseapp.com",
            databaseURL: "https://bowling-team-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "bowling-team",
            storageBucket: "bowling-team.firebasestorage.app",

        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const historyRef = ref(db, 'historyRounds');
        const customRestaurantsRef = ref(db, 'customRestaurants');

        const presetNames = [
            "團團", "圓圓", "圓仔", "花", "破鳳", 
            "老朱", "大吳", "小吳", "友仔", "Misha", "Peter", "台長", "阿卡",
            "陳彤", "楷雲"
        ];

        const AUTH_PASSWORD = "765765765";

        let historyRounds = [];
        let customRestaurants = [];
        let isHistoryExpanded = false;
        let clearConfirmTimer = null;
        let clearStep = 0;
        let currentSessionResult = null;
        
        let editingIndex = null;
        let editingModalData = {
            eventDate: '',
            teams: [],
            bye: ''
        };

        function clearCurrentResultUI() {
            currentSessionResult = null;
            document.getElementById('currentResult').innerHTML = '<div class="empty-text">⚡ 點擊上方按鈕開始隨機隊伍配對</div>';
            document.getElementById('copyCurrentBtn').style.display = 'none';
            document.getElementById('lineCurrentBtn').style.display = 'none';
        }

        window.addEventListener('beforeunload', clearCurrentResultUI);

        function getNextTargetDay() {
            const today = new Date();
            const dayOfWeek = today.getDay();

            if (dayOfWeek === 3 || dayOfWeek === 6) return today;

            const daysUntilWednesday = (3 - dayOfWeek + 7) % 7;
            const daysUntilSaturday = (6 - dayOfWeek + 7) % 7;
            const minDaysToAdd = Math.min(daysUntilWednesday, daysUntilSaturday);

            const targetDate = new Date(today);
            targetDate.setDate(today.getDate() + minDaysToAdd);
            return targetDate;
        }

        function getSortedHistory(rounds = historyRounds) {
            const now = new Date();
            const todayStr = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;

            const futureRounds = [];
            const pastRounds = [];

            rounds.forEach((round) => {
                const originalIndex = historyRounds.indexOf(round);
                const item = { ...round, originalIndex };
                if (round.eventDate >= todayStr) {
                    futureRounds.push(item);
                } else {
                    pastRounds.push(item);
                }
            });

            futureRounds.sort((a, b) => (a.eventDate || '').localeCompare(b.eventDate || ''));
            pastRounds.sort((a, b) => (a.eventDate || '').localeCompare(b.eventDate || ''));

            return [...futureRounds, ...pastRounds];
        }

        function getFilteredHistory() {
            const startVal = document.getElementById('startDate').value;
            const endVal = document.getElementById('endDate').value;

            return historyRounds.filter(round => {
                if (!round.eventDate) return false;
                if (startVal && round.eventDate < startVal) return false;
                if (endVal && round.eventDate > endVal) return false;
                return true;
            });
        }

        function extractPlaceNameFromUrl(url) {
            try {
                const decodedUrl = decodeURIComponent(url);
                const placeMatch = decodedUrl.match(/\/place\/([^\/@\?]+)/);
                if (placeMatch && placeMatch[1]) return placeMatch[1].replace(/\+/g, ' ');
                const queryMatch = decodedUrl.match(/[?&]query=([^&]+)/);
                if (queryMatch && queryMatch[1]) return queryMatch[1].replace(/\+/g, ' ').replace(/ 台灣$/, '');
            } catch (e) {
                console.error("解析網址失敗:", e);
            }
            return "Google 地圖連結";
        }

        function parseRestaurantInput(inputVal) {

            const isUrl = inputVal.startsWith('http://') || inputVal.startsWith('https://');

            if (isUrl) {
                const extractedName = extractPlaceNameFromUrl(inputVal);
                return { name: extractedName, url: inputVal };
            }

            return {

                url: `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(inputVal + ' 台灣')}`

        }

        window.generateTeams = function() {
            const rawText = document.getElementById('nameInput').value;
            let players = rawText.split('\n').map(n => n.trim()).filter(n => n.length > 0);
            const eventDateVal = document.getElementById('eventDate').value;
            const restaurantInputVal = document.getElementById('restaurantInput').value.trim();

            if (!eventDateVal) return alert("請選擇活動日期！");
            if (players.length < 2) return alert("請至少選擇 2 位訓練家！");

            const restaurantData = parseRestaurantInput(restaurantInputVal);

            if (restaurantData.name && restaurantData.name !== "Google 地圖連結" && !customRestaurants.includes(restaurantData.name)) {
                customRestaurants.push(restaurantData.name);
                set(customRestaurantsRef, customRestaurants);
            }

            function shuffle(array) {
                for (let i = array.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [array[i], array[j]] = [array[j], array[i]];
                }
                return array;
            }

            function isPairInRecentHistory(p1, p2, recentRoundsCount) {
                const recentRounds = historyRounds.slice(-recentRoundsCount);
                return recentRounds.some(round => 
                    round.teams.some(team => (team[0] === p1 && team[1] === p2) || (team[0] === p2 && team[1] === p1))
                );
            }

            function isByeInRecentHistory(player, recentRoundsCount) {
                const recentRounds = historyRounds.slice(-recentRoundsCount);
                return recentRounds.some(round => round.bye === player);
            }

            let validMatchFound = false;
            let bestTeams = [], bestBye = null;

            const constraintLevels = [
                { pairHistory: 3, byeHistory: 3 },
                { pairHistory: 2, byeHistory: 2 },
                { pairHistory: 1, byeHistory: 1 },
                { pairHistory: 0, byeHistory: 0 }
            ];

            for (let level of constraintLevels) {
                for (let attempt = 0; attempt < 300; attempt++) {
                    let currentPlayers = shuffle([...players]);
                    let currentBye = null;

                    if (currentPlayers.length % 2 !== 0) {
                        let candidateIndex = currentPlayers.findIndex(p => !isByeInRecentHistory(p, level.byeHistory));
                        currentBye = candidateIndex !== -1 ? currentPlayers.splice(candidateIndex, 1)[0] : currentPlayers.pop();
                    }

                    let tempTeams = [], isValid = true;
                    for (let i = 0; i < currentPlayers.length; i += 2) {
                        let p1 = currentPlayers[i], p2 = currentPlayers[i + 1];
                        if (isPairInRecentHistory(p1, p2, level.pairHistory)) {
                            isValid = false; break;
                        }
                        tempTeams.push([p1, p2]);
                    }

                    if (isValid) {
                        bestTeams = tempTeams;
                        bestBye = currentBye;
                        validMatchFound = true;
                        break;
                    }
                }
                if (validMatchFound) break;
            }

            const newRound = {
                eventDate: eventDateVal,
                restaurantName: restaurantData.name,
                mapUrl: restaurantData.url,
                teams: bestTeams,
                bye: bestBye || ''
            };

            currentSessionResult = newRound;
            renderCurrentResult(newRound);

            let updatedHistory = [...historyRounds, newRound];
            if (updatedHistory.length > 30) updatedHistory = updatedHistory.slice(-30);

            set(historyRef, updatedHistory);
        };

        function formatRestaurantHTML(round, originalIndex = null) {
            const url = round.mapUrl || (round.restaurant && round.restaurant.startsWith('http') ? round.restaurant : '');
            let name = round.restaurantName || round.restaurant || '';

            if (name.startsWith('http://') || name.startsWith('https://')) {
                name = extractPlaceNameFromUrl(name);
            }

            let content = '';
            if (url) {
                const displayName = (name && name !== "Google 地圖連結") ? name : "查看 Google 地圖";
                content = `🍽️ <a href="${url}" target="_blank" class="restaurant-link">📍 ${displayName}</a>`;
            } else if (name) {
                content = `🍽️ 📍 ${name}`;
            } else {
                content = `🍽️ 尚未設定餐廳`;
            }

            let editBtnHtml = '';
            if (originalIndex !== null) {
                editBtnHtml = `<button class="btn-edit" onclick="editRestaurantByIndex(${originalIndex})">✏️ 編輯餐廳</button>`;
            }

            return `<div class="result-item full-width restaurant-item-box">
                <div>${content}</div>
                ${editBtnHtml}
            </div>`;
        }

        function formatRoundText(round) {
            let lines = [`📅 活動日期：${round.eventDate}`];
            const url = round.mapUrl || (round.restaurant && round.restaurant.startsWith('http') ? round.restaurant : '');
            let name = round.restaurantName || round.restaurant || '';
            if (name.startsWith('http://') || name.startsWith('https://')) {
                name = extractPlaceNameFromUrl(name);
            }

            if (url) {
                if (name && name !== "Google 地圖連結") {
                    lines.push(`🍽️ 用餐餐廳：${name}`);
                    lines.push(`📍 地圖連結：${url}`);
                } else {
                    lines.push(`📍 地圖連結：${url}`);
                }
            } else if (name) {
                lines.push(`🍽️ 用餐餐廳：${name}`);
            }

            round.teams.forEach((team, index) => {
                lines.push(`第 ${index + 1} 組：${team[0]} & ${team[1]}`);
            });
            if (round.bye) lines.push(`此次爽打：${round.bye}`);
            return lines.join('\n');
        }

        function renderHistory() {
            const historyContainer = document.getElementById('historyList');
            const toggleBtn = document.getElementById('toggleHistoryBtn');
            const filterContainer = document.getElementById('filterContainer');

            if (historyRounds.length === 0) {
                historyContainer.innerHTML = '<div class="empty-text">尚無對戰圖鑑紀錄</div>';

                filterContainer.style.display = 'none';
                resetClearBtn();

            filterContainer.style.display = isHistoryExpanded ? 'block' : 'none';

            const filteredRounds = getFilteredHistory();

            if (filteredRounds.length === 0) {
                historyContainer.innerHTML = '<div class="empty-text">所選的時間區間內無紀錄</div>';
                toggleBtn.style.display = 'none';
                return;
            }

            const sortedHistory = getSortedHistory(filteredRounds);
            const displayRounds = isHistoryExpanded ? sortedHistory : sortedHistory.slice(0, 1);

            let html = "";
            displayRounds.forEach((round) => {
                const originalIndex = round.originalIndex;
                let restaurantHtml = formatRestaurantHTML(round, originalIndex);
                let teamsHtml = round.teams.map((t, idx) => `<div>第 ${idx + 1} 組：<span class="team-badge">${t[0]}</span> & <span class="team-badge">${t[1]}</span></div>`).join('');

                /* 按鈕順序調整為：編輯對戰 -> 刪除 -> 複製 -> LINE */

                            <button class="btn-copy" onclick="copyRoundByIndex(${originalIndex})">📋 複製</button>
                            <button class="btn-line" onclick="shareLineByIndex(${originalIndex})">💬 LINE</button>
                        </div>
                    </div>
                    <div class="history-teams">
                        ${restaurantHtml}
                        ${teamsHtml}
                        ${byeHtml}
                    </div>
                </div>`;
            });

            historyContainer.innerHTML = html;

            if (filteredRounds.length > 1) {
                toggleBtn.style.display = 'block';

                    ? `👆 收合對戰圖鑑` 
                    : `👇 展開更多紀錄 (共 ${filteredRounds.length} 筆符合條件紀錄)`;

                const groupDiv = document.createElement('div');
                groupDiv.style.marginBottom = '10px';
                groupDiv.innerHTML = `<div style="font-size:0.85rem; font-weight:800; color:#475569;">第 ${tIdx + 1} 組</div>`;

                const dropZone = document.createElement('div');
                dropZone.className = 'drop-zone';
                dropZone.dataset.teamIndex = tIdx;

                team.forEach((player, pIdx) => {
                    dropZone.appendChild(createDraggableTag(player, tIdx, pIdx));
                });

                setupDropZone(dropZone);
                groupDiv.appendChild(dropZone);
                teamsContainer.appendChild(groupDiv);
            });

            // 輪空區
            const byeZone = document.getElementById('editModalByeZone');
            byeZone.innerHTML = '';
            if (editingModalData.bye) {
                byeZone.appendChild(createDraggableTag(editingModalData.bye, 'bye', 0));
            }
            setupDropZone(byeZone);
        }

        function createDraggableTag(name, teamIdx, pIdx) {
            const tag = document.createElement('div');
            tag.className = 'draggable-player';
            tag.draggable = true;
            tag.innerText = name;

            const delBtn = document.createElement('button');
            delBtn.className = 'btn-del-p';
            delBtn.innerText = '×';
            delBtn.onclick = (e) => {
                e.stopPropagation();
                removePlayerFromModal(teamIdx, pIdx);
            };
            tag.appendChild(delBtn);

            tag.addEventListener('dragstart', (e) => {
                e.dataTransfer.setData('text/plain', JSON.stringify({
                    fromTeam: teamIdx,
                    fromIndex: pIdx,
                    name: name
                }));
            });

            return tag;
        }

        function setupDropZone(dropZone) {
            dropZone.addEventListener('dragover', (e) => {
                e.preventDefault();
                dropZone.classList.add('drag-over');
            });

            dropZone.addEventListener('dragleave', () => {
                dropZone.classList.remove('drag-over');
            });

            dropZone.addEventListener('drop', (e) => {
                e.preventDefault();
                dropZone.classList.remove('drag-over');

                const rawData = e.dataTransfer.getData('text/plain');
                if (!rawData) return;
                const data = JSON.parse(rawData);

                const toTeam = dropZone.dataset.teamIndex;

                if (data.fromTeam === 'bye') {
                    editingModalData.bye = '';
                } else {
                    editingModalData.teams[data.fromTeam].splice(data.fromIndex, 1);
                }

                if (toTeam === 'bye') {
                    if (editingModalData.bye) {
                        if (editingModalData.teams.length === 0) editingModalData.teams.push([]);
                        editingModalData.teams[editingModalData.teams.length - 1].push(editingModalData.bye);
                    }
                    editingModalData.bye = data.name;
                } else {
                    const targetTeamIdx = parseInt(toTeam);
                    editingModalData.teams[targetTeamIdx].push(data.name);
                }

                renderModalTeams();
            });
        }

        window.saveEditModal = function() {
            if (editingIndex === null) return;

            const newDate = document.getElementById('editModalDate').value;
            if (!newDate) return alert("活動日期不能為空！");

            const cleanedTeams = editingModalData.teams.filter(t => t.length > 0);

            let updatedRounds = [...historyRounds];
            updatedRounds[editingIndex] = {
                ...updatedRounds[editingIndex],
                eventDate: newDate,
                teams: cleanedTeams,
                bye: editingModalData.bye
            };

            set(historyRef, updatedRounds);
            closeEditModal();
            alert("對戰紀錄變更成功！");
        };

        initNameTags();
    </script>
</body>
</html>
