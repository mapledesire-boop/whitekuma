<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>白熊保齡球 🎳</title>
    <!-- 引入圓潤活潑日系字體 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #F8F9FA;           /* 乾淨白灰底 */
            --card-bg: #FFFFFF;            /* 純白卡片 */
            --poke-red: #FF5350;           /* 精靈球紅 */
            --poke-red-hover: #E04340;
            --poke-yellow: #FFCB05;        /* 皮卡丘電光黃 */
            --poke-blue: #2A75BB;          /* 寶可夢藍 */
            --poke-dark: #3C5AA6;
            --text-main: #2A2A2A;          /* 深灰文字 */
            --text-sub: #757575;
            --border-line: #E0E0E0;
            --radius-lg: 20px;
            --radius-sm: 12px;
            --shadow-poke: 0 6px 18px rgba(255, 83, 80, 0.12);
            --transition: all 0.2s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { 
            font-family: 'M PLUS Rounded 1c', -apple-system, sans-serif;
            max-width: 480px; margin: 0 auto; padding: 16px 12px; 
            background-color: var(--bg-color); color: var(--text-main); line-height: 1.5;
        }

        /* 寶可夢風格標題區塊 */
        .header-container { text-align: center; margin: 8px 0 16px 0; }
        .header-title-box {
            display: inline-flex; align-items: center; justify-content: center; gap: 6px;
            background: #FFFFFF; padding: 6px 16px; border-radius: 30px;
            border: 2px solid var(--poke-red); box-shadow: 0 4px 10px rgba(255, 83, 80, 0.15);
        }
        .header-img { width: 36px; height: 36px; object-fit: contain; }
        .header-title { 
            font-size: 1.15rem; font-weight: 900; color: #2C2C2C; 
            margin: 0; letter-spacing: 0.5px;
        }
        .subtitle { 
            font-size: 0.82rem; color: var(--poke-red); margin-top: 8px; font-weight: 800;
            display: flex; align-items: center; justify-content: center; gap: 4px;
        }

        /* 卡片容器 */
        .box { 
            background-color: var(--card-bg); border-radius: var(--radius-lg); 
            padding: 18px 16px; margin-bottom: 14px; box-shadow: var(--shadow-poke);
            border: 2px solid #F0F0F0; position: relative; overflow: hidden;
        }
        
        /* 卡片角落精靈球水印裝飾 */
        .box::after {
            content: ''; position: absolute; right: -15px; bottom: -15px;
            width: 70px; height: 70px;
            background: radial-gradient(circle, transparent 20%, rgba(255, 83, 80, 0.05) 21%);
            border: 6px solid rgba(0, 0, 0, 0.03); border-radius: 50%; pointer-events: none;
        }

        label { font-size: 0.88rem; color: #333; font-weight: 800; display: block; margin-bottom: 6px; }

        .input-group { margin-bottom: 14px; }

        /* 輸入框風格 */
        input[type="date"], input[type="text"], textarea { 
            width: 100%; padding: 10px 12px; border: 2px solid #E8E8E8; border-radius: var(--radius-sm); 
            font-size: 14px; font-family: inherit; background-color: #FAFAFA; color: var(--text-main); 
            font-weight: 700; transition: var(--transition); -webkit-appearance: none;
        }
        
        input[type="date"]:focus, input[type="text"]:focus, textarea:focus { 
            outline: none; border-color: var(--poke-red); background-color: #FFFFFF; 
            box-shadow: 0 0 0 3px rgba(255, 83, 80, 0.15);
        }

        .input-with-btn { display: flex; gap: 8px; }
        .input-with-btn input { flex: 1; }
        
        .btn-paste {
            padding: 0 12px; border: 2px solid #D0E1FD; background-color: #EBF3FF; color: var(--poke-blue);
            border-radius: var(--radius-sm); font-weight: 800; font-size: 0.82rem; cursor: pointer;
            transition: var(--transition); white-space: nowrap; display: flex; align-items: center;
        }
        .btn-paste:active { transform: scale(0.95); background-color: #D6E6FF; }

        textarea { min-height: 80px; resize: vertical; }

        /* 訓練家名牌標籤 */
        .tag-container { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 14px 0; }
        .name-tag { 
            padding: 6px 12px; border: 2px solid #EAEAEA; background-color: #FAFAFA; color: #444; 
            border-radius: 20px; cursor: pointer; font-size: 0.82rem; font-weight: 800;
            transition: var(--transition); user-select: none; display: inline-flex; align-items: center; 
            justify-content: center; min-height: 34px;
        }
        .name-tag:active { transform: scale(0.92); }
        .name-tag.active { 
            background-color: var(--poke-yellow); color: #222; border-color: #3C3C3C; 
            box-shadow: 2px 2px 0px #3C3C3C; transform: translateY(-1px);
        }

        /* 按鈕風格 */
        .btn-action { margin-top: 12px; display: flex; gap: 8px; }
        button.action-btn { 
            flex: 1; padding: 11px; border: none; border-radius: var(--radius-sm); cursor: pointer; 
            font-size: 0.95rem; font-weight: 900; min-height: 46px; font-family: inherit;
            display: inline-flex; align-items: center; justify-content: center; transition: var(--transition);
        }
        
        .btn-primary { 
            background-color: var(--poke-red); color: white; 
            box-shadow: 0 4px 12px rgba(255, 83, 80, 0.3); border: 2px solid #D83A37;
        }
        .btn-primary:active { transform: scale(0.96); background-color: var(--poke-red-hover); }
        
        .btn-secondary { background-color: #F0F0F0; color: #555; border: 2px solid #E0E0E0; }
        .btn-secondary:active { transform: scale(0.96); background-color: #E2E2E2; }
        
        .btn-danger { background-color: #FFEAE8; color: #D83A37; padding: 5px 10px; font-size: 0.78rem; border-radius: 8px; border: 1.5px solid #FFC4C2; font-weight: 800; cursor: pointer; }
        .btn-copy { background-color: #EBF3FF; color: var(--poke-blue); padding: 5px 10px; font-size: 0.78rem; border-radius: 8px; border: 1.5px solid #B3D0FF; font-weight: 800; cursor: pointer; }

        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .section-header h3 { margin: 0; font-size: 1rem; color: #2C2C2C; font-weight: 900; display: flex; align-items: center; gap: 6px; }
        
        /* 彈跳動畫 */
        .pop-in { animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes popIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        /* 組隊結果卡片 */
        .result-item { 
            padding: 8px 12px; background-color: #FAFAFA; border-radius: var(--radius-sm); 
            margin-bottom: 6px; font-size: 0.88rem; font-weight: 700; border: 1.5px solid #EAEAEA;
        }
        .team-badge { background: #EBF3FF; color: var(--poke-blue); padding: 2px 8px; border-radius: 6px; font-weight: 900; border: 1px solid #B3D0FF; margin: 0 2px; }
        .bye-badge { background: #FFF7D6; color: #8A6D00; padding: 2px 8px; border-radius: 6px; font-weight: 900; border: 1px solid #FFE885; }
        
        /* 歷史紀錄卡片 */
        .history-card {
            background: #FAFAFA; border-radius: var(--radius-sm); padding: 10px 12px; margin-bottom: 8px;
            border: 1.5px solid #EAEAEA; transition: var(--transition);
        }
        .history-header { display: flex; justify-content: space-between; align-items: center; }
        .history-meta { font-size: 0.78rem; color: var(--text-sub); font-weight: 700; }
        .history-teams { 
            font-size: 0.85rem; line-height: 1.5; margin-top: 8px; padding-top: 8px;
            border-top: 1px dashed #E0E0E0; display: grid; grid-template-columns: 1fr 1fr; gap: 4px; font-weight: 700;
        }
        .history-teams .full-width { grid-column: span 2; }
        
        .toggle-history-btn {
            width: 100%; text-align: center; padding: 8px; background: #FFFFFF; border: 2px dashed #D0D0D0;
            border-radius: var(--radius-sm); color: var(--text-sub); font-size: 0.82rem; cursor: pointer;
            margin-top: 6px; font-weight: 800; transition: var(--transition);
        }
        .toggle-history-btn:hover { background-color: #FAFAFA; color: var(--text-main); }

        .empty-text { color: var(--text-sub); font-size: 0.85rem; text-align: center; padding: 14px 0; font-weight: 700; }
        
        .restaurant-link { color: var(--poke-blue); font-weight: 800; text-decoration: none; word-break: break-all; }
        .restaurant-link:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <div class="header-container">
        <div class="header-title-box">
            <!-- 皮卡丘可愛圖示 -->
            <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/25.png" alt="Pikachu" class="header-img">
            <h2 class="header-title">白熊保齡球 🎳</h2>
        </div>
        <div class="subtitle">
            <span>就決定是你了！不能黑箱的決鬥抽籤 ⚡</span>
        </div>
    </div>

    <!-- 輸入區塊 -->
    <div class="box">
        <div class="input-group">
            <label for="eventDate">📅 活動日期</label>
            <input type="date" id="eventDate">
        </div>

        <div class="input-group">
            <label for="restaurantInput">🍽️ 用餐餐廳</label>
            <div class="input-with-btn">
                <input type="text" id="restaurantInput" placeholder="餐廳名稱或貼上地圖短網址...">
                <button class="btn-paste" onclick="pasteClipboard()">📋 貼上</button>
            </div>
        </div>

        <label>👥 選擇登場訓練家</label>
        <div class="tag-container" id="tagContainer"></div>

        <label for="nameInput">📝 參賽訓練家名單（每行一位）</label>
        <textarea id="nameInput" placeholder="點擊上方按鈕選取，或直接輸入..."></textarea>
        
        <div class="btn-action">
            <button id="btnGenerate" class="action-btn btn-primary" onclick="generateTeams()">⚡ 開始擲球配對</button>
            <button class="action-btn btn-secondary" onclick="clearAll()">重置</button>
        </div>
    </div>

    <!-- 本次結果區塊 -->
    <div class="box">
        <div class="section-header">
            <h3>🔴 本次對戰組合</h3>
            <button id="copyCurrentBtn" class="btn-copy" style="display: none;" onclick="copyCurrentResult()">📋 複製戰報</button>
        </div>
        <div id="currentResult"><div class="empty-text">⚡ 點擊上方按鈕開始隨機隊伍配對</div></div>
    </div>

    <!-- 歷史紀錄區塊 -->
    <div class="box">
        <div class="section-header">
            <h3>📖 訓練家對戰圖鑑 (歷史紀錄)</h3>
            <button id="btnClearCloud" class="btn-danger" onclick="clearCloudHistory()">🗑️ 清空紀錄</button>
        </div>
        <div id="historyList"><div class="empty-text">連線至 Firebase 中...</div></div>
        <button id="toggleHistoryBtn" class="toggle-history-btn" style="display: none;" onclick="toggleHistoryExpand()">👇 展開更多對戰圖鑑紀錄</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getDatabase, ref, set, onValue, remove } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCKmizSfVR7fJU4DnCkK51hxkxnCNsHg54",
            authDomain: "bowling-team.firebaseapp.com",
            databaseURL: "https://bowling-team-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "bowling-team",
            storageBucket: "bowling-team.firebasestorage.app",
            messagingSenderId: "469257467016",
            appId: "1:469257467016:web:dd9f37953cf33ef4bf1b3d"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const historyRef = ref(db, 'historyRounds');

        const presetNames = [
            "團團", "圓圓", "圓仔", "花", "破鳳", 
            "老朱", "大吳", "小吳", "友仔", "Misha", "Peter", "台長", "阿卡",
            "陳彤", "楷雲"
        ];

        let historyRounds = [];
        let isHistoryExpanded = false;

        function getNextTargetDay() {
            const today = new Date();
            const dayOfWeek = today.getDay();

            if (dayOfWeek === 3 || dayOfWeek === 6) return today;

            const daysUntilWednesday = (3 - dayOfWeek + 7) % 7;
            const daysUntilSaturday = (6 - dayOfWeek + 7) % 7;
            const minDaysToAdd = Math.min(daysUntilWednesday, daysUntilSaturday);

            const targetDate = new Date(today);
            targetDate.setDate(today.getDate() + minDaysToAdd);
            return targetDate;
        }

        document.getElementById('eventDate').valueAsDate = getNextTargetDay();

        function initNameTags() {
            const container = document.getElementById('tagContainer');
            container.innerHTML = '';
            presetNames.forEach(name => {
                const tag = document.createElement('div');
                tag.className = 'name-tag';
                tag.innerText = '⚡ ' + name;
                tag.onclick = () => toggleName(name, tag);
                container.appendChild(tag);
            });
        }

        function toggleName(name, element) {
            const textarea = document.getElementById('nameInput');
            let currentList = textarea.value.split('\n').map(n => n.trim()).filter(n => n.length > 0);

            const index = currentList.indexOf(name);
            if (index === -1) {
                currentList.push(name);
                element.classList.add('active');
                element.innerText = '★ ' + name;
            } else {
                currentList.splice(index, 1);
                element.classList.remove('active');
                element.innerText = '⚡ ' + name;
            }

            textarea.value = currentList.join('\n');
        }

        window.pasteClipboard = async function() {
            try {
                if (navigator.clipboard && navigator.clipboard.readText) {
                    const text = await navigator.clipboard.readText();
                    if (text) {
                        document.getElementById('restaurantInput').value = text;
                    }
                } else {
                    alert("請手動長按輸入框貼上！");
                }
            } catch (err) {
                alert("請授權剪貼簿讀取權限，或手動貼上！");
            }
        };

        window.clearAll = function() {
            document.getElementById('nameInput').value = '';
            document.getElementById('restaurantInput').value = '';
            const tags = document.querySelectorAll('.name-tag');
            tags.forEach((tag, index) => {
                tag.classList.remove('active');
                tag.innerText = '⚡ ' + presetNames[index];
            });
        };

        onValue(historyRef, (snapshot) => {
            const data = snapshot.val();
            historyRounds = data ? Object.values(data) : [];
            renderHistory();
            
            if (historyRounds.length > 0) {
                renderCurrentResult(historyRounds[historyRounds.length - 1]);
            } else {
                document.getElementById('currentResult').innerHTML = '<div class="empty-text">⚡ 點擊上方按鈕開始隨機隊伍配對</div>';
                document.getElementById('copyCurrentBtn').style.display = 'none';
            }
        });

        window.clearCloudHistory = function() {
            if (historyRounds.length === 0) return;
            if (!confirm("確定要清空 Firebase 上的所有對戰紀錄嗎？")) return;
            remove(historyRef);
        };

        function parseRestaurantInput(inputVal) {
            if (!inputVal) return { name: '', url: '' };

            const isUrl = inputVal.startsWith('http://') || inputVal.startsWith('https://');

            if (isUrl) {
                return {
                    name: "Google 地圖連結",
                    url: inputVal
                };
            }

            return {
                name: inputVal,
                url: `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(inputVal)}`
            };
        }

        window.generateTeams = function() {
            const rawText = document.getElementById('nameInput').value;
            let players = rawText.split('\n').map(n => n.trim()).filter(n => n.length > 0);
            const eventDateVal = document.getElementById('eventDate').value;
            const restaurantInputVal = document.getElementById('restaurantInput').value.trim();

            if (!eventDateVal) return alert("請選擇活動日期！");
            if (players.length < 2) return alert("請至少選擇 2 位訓練家！");

            const restaurantData = parseRestaurantInput(restaurantInputVal);

            function shuffle(array) {
                for (let i = array.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [array[i], array[j]] = [array[j], array[i]];
                }
                return array;
            }

            function isPairInRecentHistory(p1, p2, recentRoundsCount) {
                const recentRounds = historyRounds.slice(-recentRoundsCount);
                return recentRounds.some(round => 
                    round.teams.some(team => (team[0] === p1 && team[1] === p2) || (team[0] === p2 && team[1] === p1))
                );
            }

            function isByeInRecentHistory(player, recentRoundsCount) {
                const recentRounds = historyRounds.slice(-recentRoundsCount);
                return recentRounds.some(round => round.bye === player);
            }

            let validMatchFound = false;
            let bestTeams = [], bestBye = null;

            const constraintLevels = [
                { pairHistory: 2, byeHistory: 2 },
                { pairHistory: 1, byeHistory: 1 },
                { pairHistory: 0, byeHistory: 0 }
            ];

            for (let level of constraintLevels) {
                for (let attempt = 0; attempt < 200; attempt++) {
                    let currentPlayers = shuffle([...players]);
                    let currentBye = null;

                    if (currentPlayers.length % 2 !== 0) {
                        let candidateIndex = currentPlayers.findIndex(p => !isByeInRecentHistory(p, level.byeHistory));
                        currentBye = candidateIndex !== -1 ? currentPlayers.splice(candidateIndex, 1)[0] : currentPlayers.pop();
                    }

                    let tempTeams = [], isValid = true;
                    for (let i = 0; i < currentPlayers.length; i += 2) {
                        let p1 = currentPlayers[i], p2 = currentPlayers[i + 1];
                        if (isPairInRecentHistory(p1, p2, level.pairHistory)) {
                            isValid = false; break;
                        }
                        tempTeams.push([p1, p2]);
                    }

                    if (isValid) {
                        bestTeams = tempTeams;
                        bestBye = currentBye;
                        validMatchFound = true;
                        break;
                    }
                }
                if (validMatchFound) break;
            }

            const now = new Date();
            const timeString = `${now.getFullYear()}/${now.getMonth()+1}/${now.getDate()} ${now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}`;

            const newRound = {
                eventDate: eventDateVal,
                restaurantName: restaurantData.name,
                mapUrl: restaurantData.url,
                time: timeString,
                teams: bestTeams,
                bye: bestBye || ''
            };

            let updatedHistory = [...historyRounds, newRound];
            
            if (updatedHistory.length > 10) {
                updatedHistory = updatedHistory.slice(-10);
            }

            set(historyRef, updatedHistory);
        };

        function formatRestaurantHTML(round) {
            const url = round.mapUrl || (round.restaurant && round.restaurant.startsWith('http') ? round.restaurant : '');
            const name = round.restaurantName || round.restaurant || '';

            if (!url && !name) return '';

            const isDirectUrl = name === "Google 地圖連結";
            const linkText = isDirectUrl ? "📍 開啟 Google 地圖" : `📍 ${name}`;

            return `<div class="result-item full-width">🍽️ <a href="${url}" target="_blank" class="restaurant-link">${linkText}</a></div>`;
        }

        function formatRoundText(round) {
            let lines = [
                `📅 活動日期：${round.eventDate}`,
                `🕒 抽選時間：${round.time}`
            ];

            const url = round.mapUrl || (round.restaurant && round.restaurant.startsWith('http') ? round.restaurant : '');
            const name = round.restaurantName || round.restaurant || '';

            if (url) {
                if (name && name !== "Google 地圖連結") {
                    lines.push(`🍽️ 用餐餐廳：${name}`);
                    lines.push(`📍 地圖連結：${url}`);
                } else {
                    lines.push(`🍽️ 用餐餐廳：${url}`);
                }
            }

            round.teams.forEach((team, index) => {
                lines.push(`第 ${index + 1} 組：${team[0]} & ${team[1]}`);
            });
            if (round.bye) lines.push(`本日輪空（爽打）：${round.bye}`);
            return lines.join('\n');
        }

        window.copyCurrentResult = function() {
            if (historyRounds.length === 0) return;
            copyToClipboard(formatRoundText(historyRounds[historyRounds.length - 1]));
        };

        window.copyRoundByIndex = function(index) {
            if (historyRounds[index]) copyToClipboard(formatRoundText(historyRounds[index]));
        };

        function copyToClipboard(text) {
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(text).then(() => alert("已複製對戰戰報！"));
            } else {
                const textarea = document.createElement("textarea");
                textarea.value = text;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand("copy");
                document.body.removeChild(textarea);
                alert("已複製對戰戰報！");
            }
        }

        function renderCurrentResult(round) {
            let html = `<div class="pop-in">`;
            html += formatRestaurantHTML(round);
            round.teams.forEach((team, index) => {
                html += `<div class="result-item">第 ${index + 1} 組：<span class="team-badge">${team[0]}</span> & <span class="team-badge">${team[1]}</span></div>`;
            });
            if (round.bye) html += `<div class="result-item">本日輪空：<span class="bye-badge">${round.bye}</span></div>`;
            html += `</div>`;

            document.getElementById('currentResult').innerHTML = html;
            document.getElementById('copyCurrentBtn').style.display = 'inline-block';
        }

        window.toggleHistoryExpand = function() {
            isHistoryExpanded = !isHistoryExpanded;
            renderHistory();
        };

        function renderHistory() {
            const historyContainer = document.getElementById('historyList');
            const toggleBtn = document.getElementById('toggleHistoryBtn');

            if (historyRounds.length === 0) {
                historyContainer.innerHTML = '<div class="empty-text">尚無對戰圖鑑紀錄</div>';
                toggleBtn.style.display = 'none';
                return;
            }

            const reversedHistory = [...historyRounds].reverse();
            const displayRounds = isHistoryExpanded ? reversedHistory : reversedHistory.slice(0, 1);

            let html = "";
            displayRounds.forEach((round, reverseIndex) => {
                const originalIndex = historyRounds.length - 1 - reverseIndex;
                let restaurantHtml = formatRestaurantHTML(round);
                let teamsHtml = round.teams.map((t, idx) => `<div>第 ${idx + 1} 組：<span class="team-badge">${t[0]}</span> & <span class="team-badge">${t[1]}</span></div>`).join('');
                let byeHtml = round.bye ? `<div class="full-width">本日輪空：<span class="bye-badge">${round.bye}</span></div>` : '';

                html += `<div class="history-card pop-in">
                    <div class="history-header">
                        <div class="history-meta">📅 ${round.eventDate} | 🕒 ${round.time.split(' ')[1] || ''}</div>
                        <button class="btn-copy" onclick="copyRoundByIndex(${originalIndex})">📋 複製</button>
                    </div>
                    <div class="history-teams">
                        ${restaurantHtml}
                        ${teamsHtml}
                        ${byeHtml}
                    </div>
                </div>`;
            });

            historyContainer.innerHTML = html;

            if (historyRounds.length > 1) {
                toggleBtn.style.display = 'block';
                toggleBtn.innerText = isHistoryExpanded 
                    ? `👆 收合對戰圖鑑` 
                    : `👇 展開較舊紀錄 (共 ${historyRounds.length} 筆圖鑑紀錄)`;
            } else {
                toggleBtn.style.display = 'none';
            }
        }

        initNameTags();
    </script>
</body>
</html>
