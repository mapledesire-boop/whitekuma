<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>白熊保齡球 🎳</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #F4F6F9;           /* 乾淨柔和底色 */
            --card-bg: #FFFFFF;            /* 純白卡片 */
            --poke-red: #FF5350;           /* 精靈球紅 */
            --poke-red-hover: #E04340;
            --poke-yellow: #FFCB05;        /* 皮卡丘電光黃 */
            --poke-blue: #2A75BB;          /* 寶可夢藍 */
            --line-green: #06C755;         /* LINE 綠色 */
            --text-main: #2C2C2C;          /* 深灰文字 */
            --text-sub: #6E7C8C;
            --border-line: #E8ECEF;
            --radius-lg: 20px;
            --radius-sm: 12px;
            --shadow-poke: 0 8px 24px rgba(42, 117, 187, 0.08);
            --transition: all 0.2s cubic-bezier(0.25, 0.8, 0.25, 1);
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { 
            font-family: 'M PLUS Rounded 1c', -apple-system, sans-serif;
            max-width: 480px; margin: 0 auto; padding: 16px 12px 40px 12px; 
            background-color: var(--bg-color); color: var(--text-main); line-height: 1.5;
        }
        .header-container { text-align: center; margin: 8px 0 14px 0; }
        .header-title-box {
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            background: #FFFFFF; padding: 8px 20px; border-radius: 30px;
            border: 2px solid var(--poke-red); box-shadow: 0 4px 14px rgba(255, 83, 80, 0.15);
        }
        .header-img { width: 34px; height: 34px; object-fit: contain; }
        .header-title { 
            font-size: 1.2rem; font-weight: 900; color: #2C2C2C; 
            margin: 0; letter-spacing: 0.5px;
        }
        .subtitle { 
            font-size: 0.82rem; color: var(--poke-red); margin-top: 8px; font-weight: 800;
            display: flex; align-items: center; justify-content: center; gap: 4px;
        }

        .btn-preset-trigger {
            margin-top: 12px;
            width: 100%;
            padding: 12px;
            background: #FFFFFF;
            border: 2px solid var(--poke-blue);
            color: var(--poke-blue);
            border-radius: 20px;
            font-weight: 900;
            font-size: 0.95rem;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(42, 117, 187, 0.1);
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            min-height: 48px;
        }
        .btn-preset-trigger:active {
            transform: scale(0.97);
            background: #EBF3FF;
        }

        .box { 
            background-color: var(--card-bg); border-radius: var(--radius-lg); 
            padding: 16px; margin-bottom: 14px; box-shadow: var(--shadow-poke);
            border: 1px solid var(--border-line); position: relative; overflow: hidden;
        }
        
        .box::after {
            content: ''; position: absolute; right: -15px; bottom: -15px;
            width: 70px; height: 70px;
            background: radial-gradient(circle, transparent 20%, rgba(255, 83, 80, 0.04) 21%);
            border: 6px solid rgba(0, 0, 0, 0.02); border-radius: 50%; pointer-events: none;
        }
        label { font-size: 0.88rem; color: #333; font-weight: 800; display: block; margin-bottom: 6px; }
        .input-group { margin-bottom: 14px; position: relative; }
        
        input[type="datetime-local"], input[type="date"], input[type="time"], input[type="text"], textarea { 
            width: 100%; padding: 12px; border: 2px solid #E2E8F0; border-radius: var(--radius-sm); 
            font-size: 15px; font-family: inherit; background-color: #F8FAFC; color: var(--text-main); 
            font-weight: 700; transition: var(--transition); -webkit-appearance: none;
            min-height: 48px;
        }
        
        input[type="date"]:focus, input[type="time"]:focus, input[type="text"]:focus, textarea:focus { 
            outline: none; border-color: var(--poke-blue); background-color: #FFFFFF; 
            box-shadow: 0 0 0 3px rgba(42, 117, 187, 0.15);
        }
        .input-with-btn { display: flex; gap: 8px; align-items: center; }
        .input-with-btn input { flex: 1; }
        
        .btn-paste {
            padding: 0 16px; border: 2px solid #D0E1FD; background-color: #EBF3FF; color: var(--poke-blue);
            border-radius: var(--radius-sm); font-weight: 800; font-size: 0.88rem; cursor: pointer;
            transition: var(--transition); white-space: nowrap; display: flex; align-items: center;
            min-height: 48px; flex-shrink: 0;
        }
        .btn-paste:active { transform: scale(0.95); background-color: #D6E6FF; }
        
        .btn-team-size, .btn-select-trigger {
            width: 100%; padding: 10px 14px; border: 2px solid #E2E8F0; background-color: #F8FAFC;
            border-radius: var(--radius-sm); color: #1E293B; font-weight: 800; font-size: 0.95rem;
            display: flex; justify-content: space-between; align-items: center; cursor: pointer;
            transition: var(--transition); min-height: 48px; text-align: left; flex: 1;
            overflow: hidden;
        }
        .btn-team-size:active, .btn-select-trigger:active { background-color: #E2E8F0; }
        .btn-select-trigger span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        
        .modal-rest-list {
            max-height: 240px; overflow-y: auto; margin-top: 10px; border-radius: var(--radius-sm);
            border: 1px solid #E2E8F0;
        }
        .modal-rest-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px; border-bottom: 1px solid #F1F5F9; font-size: 0.9rem; font-weight: 700;
            cursor: pointer; transition: var(--transition); background: #FFFFFF; min-height: 46px;
        }
        .modal-rest-item:last-child { border-bottom: none; }
        .modal-rest-item:active { background-color: #F1F5F9; }
        .modal-rest-item .rest-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .modal-rest-item .btn-del-rest {
            background: none; border: none; color: #FF5350; cursor: pointer; padding: 6px 10px;
            font-size: 0.95rem; border-radius: 6px; transition: var(--transition);
        }
        textarea { min-height: 85px; resize: vertical; }
        
        .tag-container { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 14px 0; }
        .name-tag { 
            padding: 8px 14px; border: 2px solid #E2E8F0; background-color: #F8FAFC; color: #475569; 
            border-radius: 20px; cursor: pointer; font-size: 0.88rem; font-weight: 800;
            transition: var(--transition); user-select: none; display: inline-flex; align-items: center; 
            justify-content: center; min-height: 40px;
        }
        .name-tag:active { transform: scale(0.92); }
        .name-tag.active { 
            background-color: var(--poke-yellow); color: #1E293B; border-color: #334155; 
            box-shadow: 2px 2px 0px #334155; transform: translateY(-1px);
        }
        
        .btn-action { margin-top: 12px; display: flex; gap: 8px; flex-wrap: wrap; }
        button.action-btn { 
            flex: 1; min-width: 100px; padding: 12px 8px; border: none; border-radius: var(--radius-sm); cursor: pointer; 
            font-size: 0.92rem; font-weight: 900; min-height: 48px; font-family: inherit;
            display: inline-flex; align-items: center; justify-content: center; transition: var(--transition);
        }
        
        .btn-primary { 
            background-color: var(--poke-red); color: white; 
            box-shadow: 0 4px 12px rgba(255, 83, 80, 0.3); border: 2px solid #D83A37;
            flex: 1.5;
        }
        .btn-primary:active { transform: scale(0.96); background-color: var(--poke-red-hover); }

        .btn-preset-save {
            background-color: #FFF7D6; color: #8A6D00; border: 2px solid #FFE885;
        }
        .btn-preset-save:active { transform: scale(0.96); background-color: #FFE885; }
        
        .btn-secondary { background-color: #F1F5F9; color: #475569; border: 2px solid #CBD5E1; }
        .btn-secondary:active { transform: scale(0.96); background-color: #E2E8F0; }
        
        .btn-danger, .btn-copy, .btn-line, .btn-edit, .btn-filter {
            white-space: nowrap; flex-shrink: 0; font-size: 0.82rem; font-weight: 800; 
            border-radius: 8px; padding: 8px 12px; cursor: pointer; display: inline-flex;
            align-items: center; justify-content: center; gap: 4px; line-height: 1.2;
            min-height: 40px; box-sizing: border-box; transition: var(--transition);
        }
        .btn-danger { background-color: #FFEAE8; color: #D83A37; border: 1.5px solid #FFC4C2; }
        .btn-danger:disabled { background-color: #E2E8F0; color: #94A3B8; border-color: #CBD5E1; cursor: not-allowed; opacity: 0.8; }
        .btn-copy { background-color: #EBF3FF; color: var(--poke-blue); border: 1.5px solid #B3D0FF; }
        .btn-line { background-color: #E6F9ED; color: var(--line-green); border: 1.5px solid #A3E9BC; }
        .btn-edit { background-color: #FFF7D6; color: #8A6D00; border: 1.5px solid #FFE885; }
        .btn-filter { background-color: var(--poke-blue); color: #FFFFFF; border: 1.5px solid #1D588F; }
        .btn-filter:active { transform: scale(0.95); }
        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; gap: 8px; flex-wrap: wrap; }
        .section-header h3 { margin: 0; font-size: 0.98rem; color: #1E293B; font-weight: 900; display: flex; align-items: center; gap: 4px; white-space: nowrap; }
        
        .action-group { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
        
        .filter-container {
            background: #F8FAFC; border-radius: var(--radius-sm); padding: 12px;
            margin-bottom: 14px; border: 1.5px solid #E2E8F0; box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
            display: none;
        }
        .filter-title {
            font-size: 0.85rem; font-weight: 800; color: #475569; margin-bottom: 8px; display: flex; align-items: center; gap: 4px;
        }
        .filter-date-grid { 
            display: grid; grid-template-columns: 1fr auto 1fr; gap: 6px; align-items: center; margin-bottom: 10px; 
        }
        .filter-date-grid input[type="date"] { 
            padding: 8px 6px; font-size: 0.82rem; text-align: center; min-height: 44px; border-radius: 8px;
        }
        .filter-separator { font-weight: 800; color: #94A3B8; text-align: center; font-size: 0.85rem; }
        .filter-btn-grid { display: flex; gap: 6px; width: 100%; flex-wrap: wrap; }
        .filter-btn-grid button { flex: 1; min-height: 42px; font-size: 0.82rem; padding: 6px 4px; }
        
        .pop-in { animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes popIn {
            from { opacity: 0; transform: scale(0.96); }
            to { opacity: 1; transform: scale(1); }
        }
        
        .result-item { 
            padding: 12px; background-color: #F8FAFC; border-radius: var(--radius-sm); 
            margin-bottom: 8px; font-size: 0.9rem; font-weight: 700; border: 1.5px solid #E2E8F0;
            word-break: break-all; line-height: 1.6;
        }
        .restaurant-item-box {
            display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap;
        }
        .team-badge { background: #EBF3FF; color: var(--poke-blue); padding: 3px 8px; border-radius: 6px; font-weight: 900; border: 1px solid #B3D0FF; margin: 0 2px; display: inline-block; }
        .bye-badge { background: #FFF7D6; color: #8A6D00; padding: 3px 8px; border-radius: 6px; font-weight: 900; border: 1px solid #FFE885; display: inline-block; }
        
        .history-card {
            background: #FFFFFF; border-radius: var(--radius-sm); padding: 12px; margin-bottom: 12px;
            border: 1.5px solid #E2E8F0; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03); transition: var(--transition);
        }
        .history-header { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
        .history-date-title { font-size: 0.95rem; color: #1E293B; font-weight: 900; display: flex; align-items: center; gap: 4px; }
        .history-teams { 
            font-size: 0.88rem; line-height: 1.6; padding-top: 8px;
            border-top: 1px dashed #E2E8F0; display: grid; grid-template-columns: 1fr; gap: 6px; font-weight: 700;
        }
        .history-teams .full-width { grid-column: span 1; }
        
        .toggle-history-btn {
            width: 100%; text-align: center; padding: 12px; background: #FFFFFF; border: 2px dashed #CBD5E1;
            border-radius: var(--radius-sm); color: var(--text-sub); font-size: 0.88rem; cursor: pointer;
            margin-top: 8px; font-weight: 800; transition: var(--transition); min-height: 48px;
        }
        .toggle-history-btn:active { background-color: #F8FAFC; color: var(--text-main); }
        .empty-text { color: var(--text-sub); font-size: 0.85rem; text-align: center; padding: 16px 0; font-weight: 700; }
        
        .restaurant-link { color: var(--poke-blue); font-weight: 800; text-decoration: none; word-break: break-all; }
        .restaurant-link:active { text-decoration: underline; }
        
        .modal-backdrop {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.55); z-index: 1000;
            display: flex; justify-content: center; align-items: flex-end; padding: 0;
        }
        @media (min-width: 480px) {
            .modal-backdrop { align-items: center; padding: 16px; }
        }
        .modal-content {
            background: #FFFFFF; border-top-left-radius: var(--radius-lg); border-top-right-radius: var(--radius-lg);
            width: 100%; max-width: 480px; max-height: 90vh; overflow-y: auto; padding: 16px 16px 24px 16px;
            box-shadow: 0 -8px 24px rgba(0,0,0,0.15);
            animation: popIn 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @media (min-width: 480px) {
            .modal-content { border-radius: var(--radius-lg); }
        }
        .modal-header {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 2px solid var(--border-line); padding-bottom: 10px; margin-bottom: 14px;
        }
        .modal-header h3 { margin: 0; font-size: 1.05rem; font-weight: 900; }
        .modal-close {
            background: none; border: none; font-size: 1.4rem; cursor: pointer; color: var(--text-sub);
            padding: 6px 10px; line-height: 1;
        }
        
        .size-option-list { display: flex; flex-direction: column; gap: 8px; margin: 12px 0; }
        .size-option-btn {
            padding: 14px; border: 2px solid #E2E8F0; background: #F8FAFC; border-radius: var(--radius-sm);
            font-size: 1rem; font-weight: 800; color: #1E293B; cursor: pointer; text-align: center;
            transition: var(--transition); min-height: 48px;
        }
        .size-option-btn:active, .size-option-btn.active {
            background: var(--poke-yellow); border-color: #334155; box-shadow: 2px 2px 0px #334155;
        }
        .drop-zone {
            background: #F8FAFC; border: 2px dashed #CBD5E1; border-radius: var(--radius-sm);
            padding: 10px; min-height: 54px; display: flex; flex-wrap: wrap; gap: 8px;
            align-items: center; margin-top: 6px; transition: var(--transition);
        }
        .drop-zone.drag-over {
            background: #EBF3FF; border-color: var(--poke-blue);
        }
        .draggable-player {
            background: var(--poke-yellow); color: #1E293B; border: 1.5px solid #334155;
            padding: 6px 12px; border-radius: 20px; font-weight: 800; font-size: 0.85rem;
            cursor: grab; display: inline-flex; align-items: center; gap: 6px;
            user-select: none; transition: transform 0.1s; line-height: 1.2;
        }
        .draggable-player:active { cursor: grabbing; transform: scale(0.95); }
        .draggable-player .btn-del-p {
            background: rgba(0,0,0,0.12); border: none; border-radius: 50%; width: 22px; height: 22px;
            display: inline-flex; justify-content: center; align-items: center; font-size: 0.9rem;
            cursor: pointer; color: #333; margin-left: 2px; font-weight: bold;
        }
        .draggable-player .btn-del-p:active { background: var(--poke-red); color: white; }

        .preset-card {
            background: #F8FAFC; border: 2px solid #E2E8F0; border-radius: var(--radius-sm);
            padding: 12px; margin-bottom: 12px; position: relative; transition: var(--transition);
        }
        .preset-card:active { background: #EBF3FF; border-color: var(--poke-blue); }
        .preset-date { font-weight: 900; color: var(--poke-blue); font-size: 0.95rem; margin-bottom: 4px; }
        .preset-details { font-size: 0.85rem; color: #475569; font-weight: 700; line-height: 1.5; }
        .preset-actions { display: flex; justify-content: flex-end; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
    </style>
</head>
<body>
    <div class="header-container">
        <div class="header-title-box">
            <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/25.png" alt="Pikachu" class="header-img">
            <h2 class="header-title">白熊保齡球 🎳</h2>
        </div>
        <div class="subtitle">
            <span>就決定是你了！不能黑箱的決鬥抽籤 ⚡</span>
        </div>
        <button class="btn-preset-trigger" onclick="openPresetModal()">
            📅 預組隊伍庫 <span id="presetBadgeCount">(0)</span>
        </button>
    </div>

    <!-- 輸入區塊 -->
    <div class="box">
        <div class="input-group">
            <label>📅 活動日期與時間</label>
            <div style="display: flex; gap: 8px;">
                <input type="date" id="eventDate" style="flex: 1.2;" onchange="onDateInputChange()">
                <input type="time" id="eventTime" style="flex: 0.8;" value="14:00">
            </div>
        </div>
        <div class="input-group">
            <label>👥 對戰隊伍人數</label>
            <button type="button" class="btn-team-size" onclick="openTeamSizeModal()">
                <span id="selectedTeamSizeText">2 人一組</span>
                <span>⚙️ 變更</span>
            </button>
        </div>
        <div class="input-group">
            <label>🍽️ 用餐餐廳</label>
            <div class="input-with-btn">
                <button type="button" class="btn-select-trigger" onclick="openRestaurantModal()">
                    <span id="selectedRestaurantText">尚未設定餐廳</span>
                    <span>🔍 選擇</span>
                </button>
                <button class="btn-paste" onclick="pasteClipboardMain()">📋 貼上</button>
            </div>
        </div>

        <label>👥 選擇登場訓練家</label>
        <div class="tag-container" id="tagContainer"></div>

        <label for="nameInput">📝 參賽訓練家名單（每行一位）</label>
        <textarea id="nameInput" placeholder="點擊上方按鈕選取，或直接輸入..."></textarea>
        
        <div class="btn-action">
            <button id="btnGenerate" class="action-btn btn-primary" onclick="generateTeams()">⚡ 開始擲球配對</button>
            <button class="action-btn btn-preset-save" onclick="saveToPresets()">📌 存為預組隊伍</button>
            <button class="action-btn btn-secondary" onclick="clearAll()">重置</button>
        </div>
    </div>

    <!-- 本次結果區塊 -->
    <div class="box" id="currentResultSection">
        <div class="section-header">
            <h3>🔴 本次對戰組合</h3>
            <div class="action-group">
                <button id="lineCurrentBtn" class="btn-line" style="display: none;" onclick="shareLineCurrentResult()">💬 LINE</button>
                <button id="copyCurrentBtn" class="btn-copy" style="display: none;" onclick="copyCurrentResult()">📋 複製</button>
            </div>
        </div>
        <div id="currentResult"><div class="empty-text">⚡ 點擊上方按鈕開始隨機隊伍配對</div></div>
    </div>

    <!-- 歷史紀錄區塊 -->
    <div class="box">
        <div class="section-header">
            <h3>📖 訓練家對戰圖鑑</h3>
            <button id="btnClearCloud" class="btn-danger" onclick="clearCloudHistory()">🗑️ 清空紀錄</button>
        </div>

        <!-- 時間區間選擇器 -->
        <div id="filterContainer" class="filter-container">
            <div class="filter-title">🔍 選擇歷史時間區間</div>
            <div class="filter-date-grid">
                <input type="date" id="startDate">
                <span class="filter-separator">至</span>
                <input type="date" id="endDate">
            </div>
            <div class="filter-btn-grid">
                <button class="btn-filter" onclick="applyDateFilter()">🔍 搜尋區間</button>
                <button class="btn-copy" onclick="copyRangeHistory()">📋 複製區間</button>
                <button class="btn-line" onclick="shareRangeHistoryToLine()">💬 分享區間</button>
                <button class="btn-secondary" style="font-size:0.8rem; border-radius:8px;" onclick="resetDateFilter()">重置</button>
            </div>
        </div>

        <div id="historyList"><div class="empty-text">連線至 Firebase 中...</div></div>
        <button id="toggleHistoryBtn" class="toggle-history-btn" style="display: none;" onclick="toggleHistoryExpand()">👇 展開更多對戰圖鑑紀錄</button>
    </div>

    <!-- 📅 預組隊伍庫 Modal -->
    <div id="presetModal" class="modal-backdrop" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3>📅 預組隊伍庫</h3>
                <div style="display: flex; gap: 6px; align-items: center;">
                    <button id="btnClearPresets" class="btn-danger" style="padding: 6px 10px; font-size: 0.8rem; min-height: 38px;" onclick="clearAllPresetsWithConfirm()">🗑️ 清空預組</button>
                    <button class="modal-close" onclick="closePresetModal()">✖</button>
                </div>
            </div>
            <button id="btnPairAllPresets" class="action-btn btn-primary" style="width: 100%; margin-bottom: 12px; font-size: 0.95rem; min-height: 48px;" onclick="generateAllPresetsInLoop()">🔥 組隊渡劫一時爽</button>

        function formatDateWithDay(dateStr, timeStr = '') {
            if (!dateStr) return '';
            const days = ['日', '一', '二', '三', '四', '五', '六'];
            
            let cleanDate = dateStr;
            let cleanTime = timeStr;
            if (dateStr.includes('T')) {
                const parts = dateStr.split('T');
                cleanDate = parts[0];
                if (!cleanTime) cleanTime = parts[1].slice(0, 5);
            }
            const dateObj = new Date(cleanDate + 'T00:00:00');
            if (isNaN(dateObj.getTime())) return dateStr;
            const pad = (n) => String(n).padStart(2, '0');
            const yyyy = dateObj.getFullYear();
            const mm = pad(dateObj.getMonth() + 1);
            const dd = pad(dateObj.getDate());
            const dayOfWeek = days[dateObj.getDay()];
            
            if (cleanTime) {
                return `${yyyy}-${mm}-${dd} (${dayOfWeek}) ${cleanTime}`;
            } else {
                return `${yyyy}-${mm}-${dd} (${dayOfWeek})`;
            }
        }

        function generateGoogleCalendarUrl(round) {
            if (!round || !round.eventDate) return '';
            let datePart = round.eventDate;
            let timePart = round.eventTime || '14:00';
            if (round.eventDate.includes('T')) {
                const p = round.eventDate.split('T');
                datePart = p[0];
                timePart = p[1].slice(0, 5);
            }
            const cleanDate = datePart.replace(/-/g, '');
            const cleanTime = timePart.replace(/:/g, '') + '00';
            
            const startDt = new Date(`${datePart}T${timePart}:00`);
            const endDt = new Date(startDt.getTime() + 2 * 60 * 60 * 1000);
            
            const pad = (n) => String(n).padStart(2, '0');
            const endCleanDate = `${endDt.getFullYear()}${pad(endDt.getMonth()+1)}${pad(endDt.getDate())}`;
            const endCleanTime = `${pad(endDt.getHours())}${pad(endDt.getMinutes())}00`;
            const dates = `${cleanDate}T${cleanTime}/${endCleanDate}T${endCleanTime}`;
            
            const title = encodeURIComponent("白熊保齡球");
            
            let detailsText = "【白熊保齡球戰報】\n";
            if (round.teams && round.teams.length > 0) {
                round.teams.forEach((t, i) => {
                    detailsText += `第 ${i+1} 組：${t.join(' & ')}\n`;
                });

            if (round.bye) detailsText += `此次爽打：${round.bye}\n`;
            const details = encodeURIComponent(detailsText);
            const location = encodeURIComponent(round.restaurantName || round.restaurant || '');
            return `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${title}&dates=${dates}&details=${details}&location=${location}`;
        }

        function getNextTargetDay() {
            const today = new Date();
            const dayOfWeek = today.getDay();
            if (dayOfWeek === 3 || dayOfWeek === 6) return today;
            const daysUntilWednesday = (3 - dayOfWeek + 7) % 7;
            const daysUntilSaturday = (6 - dayOfWeek + 7) % 7;
            const minDaysToAdd = Math.min(daysUntilWednesday, daysUntilSaturday);
            const targetDate = new Date(today);
            targetDate.setDate(today.getDate() + minDaysToAdd);
            return targetDate;
        }

        function getSortedHistory(rounds = historyRounds) {
            const now = new Date();
            const todayStr = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
            const futureRounds = [];
            const pastRounds = [];
            rounds.forEach((round) => {
                const originalIndex = historyRounds.indexOf(round);
                const item = { ...round, originalIndex };
                if (round.eventDate >= todayStr) {
                    futureRounds.push(item);
                } else {
                    pastRounds.push(item);
                }
            });
            futureRounds.sort((a, b) => (a.eventDate || '').localeCompare(b.eventDate || ''));
            pastRounds.sort((a, b) => (a.eventDate || '').localeCompare(b.eventDate || ''));
            return [...futureRounds, ...pastRounds];
        }

        function getFilteredHistory() {
            const startVal = document.getElementById('startDate').value;
            const endVal = document.getElementById('endDate').value;
            return historyRounds.filter(round => {
                if (!round.eventDate) return false;
                if (startVal && round.eventDate < startVal) return false;
                if (endVal && round.eventDate > endVal) return false;
                return true;
            });
        }

        async function getShortUrl(longUrl) {
            if (!longUrl) return '';
            try {
                const api = `https://is.gd/create.php?format=json&url=${encodeURIComponent(longUrl)}`;
                const response = await fetch(api);
                const data = await response.json();
                if (data && data.shorturl) {
                    return data.shorturl;
                }
            } catch (e) {
                console.warn("is.gd 短網址失敗，切換備用方案:", e);
            }
            try {
                const apiTiny = `https://tinyurl.com/api-create.php?url=${encodeURIComponent(longUrl)}`;
                const res = await fetch(apiTiny);
                const shortText = await res.text();
                if (shortText && shortText.startsWith('http')) return shortText.trim();
            } catch (e) {
                console.warn("tinyurl 短網址失敗:", e);
            }
            return longUrl;
        }

                const formattedText = await formatRoundText(sorted[i]);
                reportLines.push(formattedText);
                if (i < sorted.length - 1) reportLines.push(`------------------`);

            return reportLines.join('\n');

        // 「組隊渡劫一時爽」：一次把所有預組隊伍全部自動擲球配對
        window.generateAllPresetsInLoop = function() {
            if (presetTeams.length === 0) return alert("目前沒有任何預組隊伍！");

            const count = presetTeams.length;
            if (!confirm(`確定要將全部 ${count} 組預組隊伍進行隨機配對並匯入對戰圖鑑嗎？`)) return;

            const targets = [...presetTeams];

        function extractPlaceNameFromUrl(url) {
            try {
                const decodedUrl = decodeURIComponent(url);
                const placeMatch = decodedUrl.match(/\/place\/([^\/@\?]+)/);
                if (placeMatch && placeMatch[1]) return placeMatch[1].replace(/\+/g, ' ');
                const queryMatch = decodedUrl.match(/[?&]query=([^&]+)/);
                if (queryMatch && queryMatch[1]) return queryMatch[1].replace(/\+/g, ' ').replace(/ 台灣$/, '');
            } catch (e) {
                console.error("解析網址失敗:", e);
            }
            return "Google 地圖連結";
        }

                const extractedName = extractPlaceNameFromUrl(inputVal);
                return { name: extractedName, url: inputVal };
            }
            return {
                name: inputVal,
                url: `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(inputVal + ' 台灣')}`

        }

        window.generateTeams = function() {
            const rawText = document.getElementById('nameInput').value;
            let players = rawText.split('\n').map(n => n.trim()).filter(n => n.length > 0);
            const dateInputVal = document.getElementById('eventDate').value;
            const timeInputVal = document.getElementById('eventTime').value || '14:00';
            
            if (!dateInputVal) return alert("請選擇活動日期！");
            const eventDateVal = `${dateInputVal}T${timeInputVal}`;

            if (players.length < selectedTeamSize) return alert(`請至少選擇 ${selectedTeamSize} 位訓練家！`);

            const restaurantData = parseRestaurantInput(selectedRestaurantRaw.trim());
            if (restaurantData.name && restaurantData.name !== "Google 地圖連結" && !customRestaurants.includes(restaurantData.name)) {
                customRestaurants.push(restaurantData.name);
                set(customRestaurantsRef, customRestaurants);
            }

            function shuffle(array) {
                for (let i = array.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [array[i], array[j]] = [array[j], array[i]];
                }
                return array;
            }

            function isPairInRecentHistory(p1, p2, recentRoundsCount) {
                const recentRounds = historyRounds.slice(-recentRoundsCount);
                return recentRounds.some(round => 
                    round.teams.some(team => team.includes(p1) && team.includes(p2))
                );
            }

            function isByeInRecentHistory(player, recentRoundsCount) {
                const recentRounds = historyRounds.slice(-recentRoundsCount);
                return recentRounds.some(round => {
                    if (Array.isArray(round.bye)) return round.bye.includes(player);
                    return round.bye === player;
                });
            }

            let validMatchFound = false;
            let bestTeams = [], bestBye = [];
            const constraintLevels = [
                { pairHistory: 3, byeHistory: 3 },
                { pairHistory: 2, byeHistory: 2 },
                { pairHistory: 1, byeHistory: 1 },
                { pairHistory: 0, byeHistory: 0 }
            ];

            const hasYuanYuan = players.includes("圓圓");
            const hasYuanZai = players.includes("圓仔");
            const bothYuanYuanAndZai = hasYuanYuan && hasYuanZai;

            for (let level of constraintLevels) {
                for (let attempt = 0; attempt < 1000; attempt++) {
                    let currentPlayers = shuffle([...players]);
                    let currentBye = [];
                    const remainder = currentPlayers.length % selectedTeamSize;

                    if (remainder !== 0) {
                        const lowProbByeNames = ["團團", "破鳳", "老朱", "PETER", "台長", "楷雲", "MISHA", "陳彤", "阿卡"];
                        for (let r = 0; r < remainder; r++) {
                            let candidates = currentPlayers.map((p, idx) => ({ name: p, idx }))
                                                           .filter(c => !isByeInRecentHistory(c.name, level.byeHistory));
                            if (candidates.length === 0) {
                                candidates = currentPlayers.map((p, idx) => ({ name: p, idx }));
                            }
                            
                            let totalWeight = candidates.reduce((sum, c) => {
                                const isReduced = lowProbByeNames.some(name => name.toLowerCase() === c.name.toLowerCase());
                                return sum + (isReduced ? 0.5 : 1.0);
                            }, 0);

                            let rand = Math.random() * totalWeight;
                            let chosenIndex = candidates[0].idx;
                            for (let c of candidates) {
                                const isReduced = lowProbByeNames.some(name => name.toLowerCase() === c.name.toLowerCase());
                                const w = isReduced ? 0.5 : 1.0;
                                if (rand < w) {
                                    chosenIndex = c.idx;
                                    break;
                                }
                                rand -= w;
                            }
                            currentBye.push(currentPlayers.splice(chosenIndex, 1)[0]);
                        }
                    }

                    let tempTeams = [], isValid = true;
                    let isYuanYuanAndZaiPaired = false;

                    for (let i = 0; i < currentPlayers.length; i += selectedTeamSize) {
                        let group = currentPlayers.slice(i, i + selectedTeamSize);
                        
                        // 1. 降低 50% 「團團」與「圓圓」的組隊機率
                        if (group.includes("團團") && group.includes("圓圓")) {
                            if (Math.random() < 0.5) {
                                isValid = false;
                                break;
                            }
                        }

                        if (group.includes("圓圓") && group.includes("圓仔")) {
                            isYuanYuanAndZaiPaired = true;
                        }

                        for (let a = 0; a < group.length; a++) {
                            for (let b = a + 1; b < group.length; b++) {
                                if (isPairInRecentHistory(group[a], group[b], level.pairHistory)) {
                                    isValid = false; break;
                                }
                            }
                            if (!isValid) break;
                        }
                        if (!isValid) break;
                        tempTeams.push(group);
                    }

                    // 2. 增加 50% 「圓圓」與「圓仔」的組隊機率
                    if (isValid && bothYuanYuanAndZai && !isYuanYuanAndZaiPaired) {
                        if (Math.random() < 0.5) {
                            isValid = false;
                        }
                    }

                    if (isValid) {
                        bestTeams = tempTeams;
                        bestBye = currentBye;
                        validMatchFound = true;
                        break;
                    }
                }
                if (validMatchFound) break;
            }

            const byeString = Array.isArray(bestBye) ? bestBye.join(', ') : (bestBye || '');
            const newRound = {
                eventDate: eventDateVal,
                restaurantName: restaurantData.name,
                mapUrl: restaurantData.url,
                teams: bestTeams,
                bye: byeString
            };

            currentSessionResult = newRound;
            renderCurrentResult(newRound);

            let updatedHistory = [...historyRounds, newRound];
            if (updatedHistory.length > 30) updatedHistory = updatedHistory.slice(-30);
            set(historyRef, updatedHistory);

            // 如果是以預組隊伍帶入並組隊完成，自動刪除該筆預組資料
            if (activePresetId) {
                let updatedPresets = presetTeams.filter(p => p.id !== activePresetId);
                set(presetsRef, updatedPresets);
                activePresetId = null;
            }
        };

                            <button class="btn-edit" onclick="openEditModal(${originalIndex})">✏️ 編輯對戰</button>
                            <button class="btn-danger" style="padding: 6px 10px; min-height: 38px;" onclick="deleteSingleRoundByIndex(${originalIndex})">🗑️ 刪除</button>
                            <button class="btn-copy" onclick="copyRoundByIndex(${originalIndex})">📋 複製</button>
                            <button class="btn-line" onclick="shareLineByIndex(${originalIndex})">💬 LINE</button>
                        </div>
                    </div>
                    <div class="history-teams">
                        ${restaurantHtml}
                        ${teamsHtml}
                        ${byeHtml}
                    </div>
                </div>`;
            });

            historyContainer.innerHTML = html;

            if (filteredRounds.length > 1) {
                toggleBtn.style.display = 'block';
                toggleBtn.innerText = isHistoryExpanded 
                    ? `👆 收合對戰圖鑑` 
                    : `👇 展開更多紀錄 (共 ${filteredRounds.length} 筆符合條件紀錄)`;
            } else {
                toggleBtn.style.display = 'none';
            }
        }

        window.openEditModal = function(index) {
            const pwd = prompt("編輯對戰紀錄為管理功能，請輸入管理密碼：");
            if (pwd === null) return;
            if (pwd.trim() !== AUTH_PASSWORD) {
                alert("密碼錯誤，無法編輯對戰！");
                return;
            }
            editingIndex = index;
            const round = historyRounds[index];
            if (!round) return;

            editingModalData = {
                eventDate: round.eventDate || '',
                teams: (round.teams || []).map(t => [...t]),
                bye: round.bye || ''
            };

            if (editingModalData.eventDate.includes('T')) {
                const parts = editingModalData.eventDate.split('T');
                document.getElementById('editModalDate').value = parts[0];
                document.getElementById('editModalTime').value = parts[1].slice(0, 5);
            } else {
                document.getElementById('editModalDate').value = editingModalData.eventDate;
                document.getElementById('editModalTime').value = '14:00';
            }

            renderModalTeams();
            document.getElementById('editModal').style.display = 'flex';
        };

        window.closeEditModal = function() {
            document.getElementById('editModal').style.display = 'none';
            editingIndex = null;
        };

        window.addModalTeamGroup = function() {
            editingModalData.teams.push([]);
            renderModalTeams();
        };

        window.addPlayerToModal = function() {
            const input = document.getElementById('editModalNewPlayerName');
            const name = input.value.trim();
            if (!name) return;

            if (editingModalData.teams.length === 0) {
                editingModalData.teams.push([]);
            }
            editingModalData.teams[editingModalData.teams.length - 1].push(name);
            input.value = '';
            renderModalTeams();
        };

        window.removePlayerFromModal = function(teamIndex, playerIndex) {
            if (teamIndex === 'bye') {
                let byeArr = editingModalData.bye ? editingModalData.bye.split(',').map(s => s.trim()) : [];
                byeArr.splice(playerIndex, 1);
                editingModalData.bye = byeArr.join(', ');
            } else {
                editingModalData.teams[teamIndex].splice(playerIndex, 1);
            }
            renderModalTeams();
        };

        function renderModalTeams() {
            const teamsContainer = document.getElementById('editModalTeamsContainer');
            teamsContainer.innerHTML = '';
            editingModalData.teams.forEach((team, tIdx) => {
                const groupDiv = document.createElement('div');
                groupDiv.style.marginBottom = '10px';
                groupDiv.innerHTML = `<div style="font-size:0.85rem; font-weight:800; color:#475569;">第 ${tIdx + 1} 組</div>`;
                const dropZone = document.createElement('div');
                dropZone.className = 'drop-zone';
                dropZone.dataset.teamIndex = tIdx;

                team.forEach((player, pIdx) => {
                    dropZone.appendChild(createDraggableTag(player, tIdx, pIdx));
                });

                setupDropZone(dropZone);
                groupDiv.appendChild(dropZone);
                teamsContainer.appendChild(groupDiv);
            });

            const byeZone = document.getElementById('editModalByeZone');
            byeZone.innerHTML = '';
            let byeArr = editingModalData.bye ? editingModalData.bye.split(',').map(s => s.trim()).filter(Boolean) : [];
            byeArr.forEach((player, pIdx) => {
                byeZone.appendChild(createDraggableTag(player, 'bye', pIdx));
            });
            setupDropZone(byeZone);
        }

        function createDraggableTag(name, teamIdx, pIdx) {
            const tag = document.createElement('div');
            tag.className = 'draggable-player';
            tag.draggable = true;
            tag.innerText = name;

            const delBtn = document.createElement('button');
            delBtn.className = 'btn-del-p';
            delBtn.innerText = '×';
            delBtn.onclick = (e) => {
                e.stopPropagation();
                removePlayerFromModal(teamIdx, pIdx);
            };

            tag.appendChild(delBtn);
            tag.addEventListener('dragstart', (e) => {
                e.dataTransfer.setData('text/plain', JSON.stringify({
                    fromTeam: teamIdx,
                    fromIndex: pIdx,
                    name: name
                }));
            });
            return tag;
        }

        function setupDropZone(dropZone) {
            dropZone.addEventListener('dragover', (e) => {
                e.preventDefault();
                dropZone.classList.add('drag-over');
            });
            dropZone.addEventListener('dragleave', () => {
                dropZone.classList.remove('drag-over');
            });
            dropZone.addEventListener('drop', (e) => {
                e.preventDefault();
                dropZone.classList.remove('drag-over');
                const rawData = e.dataTransfer.getData('text/plain');
                if (!rawData) return;
                const data = JSON.parse(rawData);
                const toTeam = dropZone.dataset.teamIndex;

                let byeArr = editingModalData.bye ? editingModalData.bye.split(',').map(s => s.trim()).filter(Boolean) : [];

                if (data.fromTeam === 'bye') {
                    byeArr.splice(data.fromIndex, 1);
                    editingModalData.bye = byeArr.join(', ');
                } else {
                    editingModalData.teams[data.fromTeam].splice(data.fromIndex, 1);
                }

                if (toTeam === 'bye') {
                    byeArr.push(data.name);
                    editingModalData.bye = byeArr.join(', ');
                } else {
                    const targetTeamIdx = parseInt(toTeam);
                    editingModalData.teams[targetTeamIdx].push(data.name);
                }

                renderModalTeams();
            });
        }

        window.saveEditModal = function() {
            if (editingIndex === null) return;
            const newDateVal = document.getElementById('editModalDate').value;
            const newTimeVal = document.getElementById('editModalTime').value || '14:00';
            if (!newDateVal) return alert("活動日期不能為空！");

            const newDate = `${newDateVal}T${newTimeVal}`;
            const cleanedTeams = editingModalData.teams.filter(t => t.length > 0);

            let updatedRounds = [...historyRounds];
            updatedRounds[editingIndex] = {
                ...updatedRounds[editingIndex],
                eventDate: newDate,
                teams: cleanedTeams,
                bye: editingModalData.bye
            };

            set(historyRef, updatedRounds);
            closeEditModal();
            alert("對戰紀錄變更成功！");
        };

        initNameTags();
    </script>
</body>
</html>
